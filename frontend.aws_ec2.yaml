plugin: amazon.aws.aws_ec2
regions:
-  us-east-1
hostnames:
- private-ip-address
keyed_groups:
# This creates host groups based on architecture.
- prefix: ""
  key: frontend
filters:
  # This selects only running instances with tag `Name` tag set to `frontend-dev`.
  instance-state-name : running
  tag:Name: frontend-dev
  